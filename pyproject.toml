[project]
name = "pypmxvmd"
version = "2.7.1"
description = "Wrapper for reading and modifying VMD and PMX files"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "PythonImporter", email = "271374667@qq.com"}
]
keywords = ["mmd", "mikumikudance", "pmx", "vmd", "vpd", "3d", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers", 
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
all = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "black>=24.8.0,<25",
    "build>=1.2.2,<1.3",
    "cibuildwheel>=2.23.3,<3",
    "cython>=3.0.11",
    "flake8>=7.1.1,<7.2",
    "isort>=5.13.2,<6",
    "mkdocs>=1.6.1,<2",
    "mypy>=1.13.0,<1.14",
    "numpy>=2.4.6",
    "pytest>=8.3.5,<9",
    "pytest-cov>=5.0.0,<6",
    "pytest-xdist>=3.6,<4",
    "scipy>=1.17.1",
    "setuptools>=75.3.2,<76",
    "wheel>=0.44.0",
]
docs = [
    "mkdocs>=1.6.1,<2",
]

[project.urls]
Homepage = "https://github.com/271374667/pypmxvmd"
Documentation = "https://pypmxvmd.readthedocs.io/"
Repository = "https://github.com/271374667/pypmxvmd"
"Bug Tracker" = "https://github.com/271374667/pypmxvmd/issues"

[build-system]
requires = ["setuptools>=75.3.2,<76", "wheel>=0.44.0", "cython>=3.0.11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pypmxvmd*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
pypmxvmd = ["py.typed"]
"pypmxvmd.common.io" = ["*.pyx", "*.pyi"]
"pypmxvmd.common.parsers" = ["*.pyx", "*.pyi"]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["pypmxvmd"]

[tool.mypy]
python_version = "3.11"
cache_dir = ".cache/mypy"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config -n auto"
cache_dir = ".cache/pytest"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py", 
    "*_test.py",
]
markers = [
    "benchmark: timing-sensitive performance checks",
    "corpus: tests that use local real-world PMX/VMD files",
    "cython: tests that require compiled Cython extensions",
    "slow: tests that process large inputs or take noticeable time",
]

[tool.cibuildwheel]
build = "cp311-win_amd64"
skip = "*-win32"
test-command = "python -c \"from pypmxvmd.common.io._fast_binary import FastBinaryReader; from pypmxvmd.common.parsers._fast_pmx import parse_pmx_cython; from pypmxvmd.common.parsers._fast_vmd import parse_vmd_cython\""
